<header [class.header-home]="isHomePage" [class.header-default]="!isHomePage"
  [class.scrolled]="isHomePage && isScrolled">
  <a routerLink="/" class="header-logo" aria-label="Moonopoly home">
    <app-logo />
  </a>
  <nav>
    <a routerLink="/listings" routerLinkActive="active">Listings</a>
    <a routerLink="/publish" routerLinkActive="active">Publish</a>
    <a routerLink="/favorites" routerLinkActive="active">Favorites</a>
    <a routerLink="/my-listings" routerLinkActive="active">My listings</a>
  </nav>

  @if (auth.currentUser(); as user) {
  <div class="header-user-info">
    <a routerLink="/profile">{{ profiles.myProfile()?.displayName ?? 'My account' }}</a>
    <button type="button" (click)="logout()">Log out</button>
  </div>
  } @else {
  <a routerLink="/login" routerLinkActive="active" class="login-button">Log in</a>
  }
</header>
