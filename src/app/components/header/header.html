<header [class.header-home]="isHomePage" [class.header-default]="!isHomePage">
  <a routerLink="/" class="header-logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" width="250" height="56" fill="currentColor" role="img"
      aria-labelledby="moonopoly-title">
      <title id="moonopoly-title">Moonopoly</title>

      <defs>
        <mask id="lunar-parcel-mask">
          <rect width="64" height="64" fill="white" />

          <path d="M19 24 L37 19 L45 30 L39 43 L22 41 Z" fill="black" />

          <circle cx="18" cy="16" r="2.5" fill="black" />
        </mask>
      </defs>

      <!-- Lunar parcel icon -->
      <circle cx="28" cy="28" r="25" mask="url(#lunar-parcel-mask)" />

      <!-- Wordmark -->
      <text x="65" y="37" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="600"
        letter-spacing="-1.1">moonopoly</text>
    </svg>
  </a>
  <nav>
    <a routerLink="/listings" routerLinkActive="active">Listings</a>
    <a routerLink="/publish" routerLinkActive="active">Publish</a>
    <a routerLink="/favorites" routerLinkActive="active">Favorites</a>
  </nav>

  @if (auth.currentUser(); as user) {
  <div class="header-user-info">
    <span>{{ user.email }}</span>
    <button type="button" (click)="logout()">Log out</button>
  </div>
  } @else {
  <a routerLink="/login" routerLinkActive="active" class="login-button">Log in</a>
  }
</header>
