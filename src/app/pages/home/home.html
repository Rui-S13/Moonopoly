<app-header class="header-home"></app-header>

<main>
    <section class="hero">
        <img src="data/images/home-image.avif" alt="Home Image">

        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1>Find your place on the <span>Moon</span></h1>

            <form [formGroup]="search" class="search-form">
                <label>
                    Type
                    <select formControlName="type">
                        <option [ngValue]="null">All types</option>
                        <option value="sale">For sale</option>
                        <option value="rent">For rent</option>
                    </select>
                </label>

                <label>
                    Min Price (USD)
                    <input type="number" formControlName="minPrice" min="0" step="1000" placeholder="No minimum" />
                </label>

                <label>
                    Max Price (USD)
                    <input type="number" formControlName="maxPrice" min="0" step="1000" placeholder="No maximum" />
                </label>



                <label>Region
                    <select formControlName="region">
                        <option value="">All regions</option>
                        @for (r of regions; track r) {
                        <option [value]="r">{{ r }}</option>
                        }
                    </select>
                </label>

                <button type="button" (click)="searchListings()">Search</button>
            </form>
            @if (search.hasError('invalidPriceRange')) {
            <small class="search-error">Maximum price must be greater than or equal to minimum price.</small>
            }
        </div>
    </section>
</main>

<app-footer />
