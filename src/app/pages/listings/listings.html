<h1>Listings</h1>

@if (loading()) {
  <p>Loading listings...</p>
} @else if (error()) {
  <p>Could not load the listings. Please try again later.</p>
} @else {
  @for (listing of listings(); track listing.id) {
    <app-listing-card [listing]="listing" [isFavorite]="favorites.isFavorite(listing.id)" (favorite)="onFavorite($event)" />
  } @empty {
    <p>No listings found.</p>
  }
}
